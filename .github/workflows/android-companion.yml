name: Android Home Companion

on:
  push:
    paths:
      - "apps/android-home-companion/**"
      - ".github/workflows/android-companion.yml"
  pull_request:
    paths:
      - "apps/android-home-companion/**"
      - ".github/workflows/android-companion.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  android-debug:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - name: Set up Android SDK
        uses: android-actions/setup-android@v4
      - name: Install Android API 36
        run: sdkmanager "platforms;android-36" "build-tools;36.0.0"
      - name: Set up Gradle and validate wrapper
        uses: gradle/actions/setup-gradle@v6
      - name: Assemble debug Android app
        working-directory: apps/android-home-companion
        run: ./gradlew --no-daemon --console=plain :app:assembleDebug
      - name: Upload unsigned-for-production test APK
        uses: actions/upload-artifact@v4
        with:
          name: home-energy-companion-debug
          path: apps/android-home-companion/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
