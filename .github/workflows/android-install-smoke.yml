name: Android install and launch smoke test

on:
  pull_request:
    paths:
      - "apps/android-install-smoke/**"
      - ".github/workflows/android-install-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-install:
    name: Android 12 install and launch
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.2.1"

      - name: Build minimal APK
        run: |
          gradle -p apps/android-install-smoke :app:assembleDebug --no-daemon --max-workers=2
          test -s apps/android-install-smoke/app/build/outputs/apk/debug/app-debug.apk
          sha256sum apps/android-install-smoke/app/build/outputs/apk/debug/app-debug.apk
          "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose apps/android-install-smoke/app/build/outputs/apk/debug/app-debug.apk

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch, verify, uninstall on Android 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_4
          script: bash apps/android-install-smoke/verify-install.sh

      - name: Preserve tested APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Home-Energy-Install-Test-0.1.1-Android12-verified
          path: apps/android-install-smoke/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
