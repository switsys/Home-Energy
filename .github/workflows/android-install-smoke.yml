name: Li-Erikes Energy Android 12 installation test

on:
  pull_request:
    paths:
      - "apps/android-homeenergy-mobile/**"
      - ".github/workflows/android-install-smoke.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-install:
    name: Android 12 install and launch
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v4

      - name: Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: "9.2.1"

      - name: Build minimal and mobile APKs
        run: |
          gradle -p apps/android-homeenergy-mobile :app:testDebugUnitTest :app:assembleDebug --no-daemon --max-workers=2
          for apk in apps/android-homeenergy-mobile/app/build/outputs/apk/debug/app-debug.apk; do
            test -s "$apk"
            sha256sum "$apk"
            "${ANDROID_HOME}/build-tools/35.0.0/apksigner" verify --verbose "$apk"
          done

      - name: Enable KVM for Android emulator
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm

      - name: Install, launch and uninstall Li-Erikes Energy on Android 12
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 31
          target: google_apis
          arch: x86_64
          profile: pixel_4
          script: |
            bash apps/android-homeenergy-mobile/verify-install.sh

      - name: Preserve tested mobile APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: Li-Erikes-Energy-v0.3.0-Android12-verified
          path: apps/android-homeenergy-mobile/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

